# ============================================================
# Rajomon-HTTP — Top-Level Orchestration
#
# Benchmark: TeaStore (REST/HTTP — all services speak HTTP/1.1)
# Previous benchmark: DeathStarBench Social Network (removed —
#   used Apache Thrift binary RPC on port 9090, incompatible
#   with an HTTP reverse-proxy sidecar).
#
# Architecture:
#   Client → Envoy Gateway (:10000)
#          → sidecar-webui (:9550)       ← admission + proxy
#          → teastore-webui-upstream:8080 ← real app (unmodified)
#          → sidecar-auth / sidecar-recommender / etc. (via DNS alias)
#          → teastore-*-upstream:8080
#
# Network alias trick:
#   Real services run as teastore-<name>-upstream (hidden name).
#   Sidecars take the teastore-<name> alias (public DNS name).
#   All inter-service REST calls automatically hit sidecars first.
#   Zero application code changes required.
#
# Profiles:
#   (default)          — benchmark + sidecars + monitoring
#   --profile permissive  — add Envoy (passes X-Rajomon-Tokens intact)
#   --profile hardened    — add Envoy (strips X-Rajomon-Tokens)
# ============================================================

include:
  - path: benchmark-app/docker-compose.yml

# ── Shared sidecar template ───────────────────────────────────────────────────
# All sidecars use the same image (built once from ./sidecar).
# Service-specific env vars and network aliases differ per instance.
x-sidecar-defaults: &sidecar-defaults
  build:
    context: ./sidecar
    dockerfile: Dockerfile
  restart: "no"
  environment: &sidecar-env
    RAJOMON_BASE_PRICE: "${RAJOMON_BASE_PRICE:-1.0}"
    RAJOMON_PRICE_SCALE_FACTOR: "${RAJOMON_PRICE_SCALE_FACTOR:-0.5}"

services:

  # ══════════════════════════════════════════════════════════
  # Sidecars — one per TeaStore business-logic service
  #
  # Each sidecar:
  #   1. Listens under the real service DNS name (network alias)
  #   2. Forwards to <service>-upstream:8080 (hidden real container)
  #   3. Runs admission: read X-Rajomon-Tokens, compute price,
  #      forward or 503, write X-Rajomon-Price on response
  # ══════════════════════════════════════════════════════════

  # ── Web UI sidecar ───────────────────────────────────────
  # Entry-point sidecar. Envoy forwards here. WebUI calls
  # downstream services which resolve to their sidecars via aliases.
  sidecar-webui:
    <<: *sidecar-defaults
    environment:
      <<: *sidecar-env
      RAJOMON_SERVICE_NAME: webui
      RAJOMON_LISTEN_ADDR: ":9550"
      RAJOMON_UPSTREAM_ADDR: "teastore-webui-upstream:8080"
    ports:
      - "9550:9550"
    networks:
      default:
        aliases:
          - teastore-webui    # ← WebUI is discovered under this name by the registry
    depends_on:
      - teastore-webui

  # ── Auth sidecar ─────────────────────────────────────────
  sidecar-auth:
    <<: *sidecar-defaults
    environment:
      <<: *sidecar-env
      RAJOMON_SERVICE_NAME: auth
      RAJOMON_LISTEN_ADDR: ":9551"
      RAJOMON_UPSTREAM_ADDR: "teastore-auth-upstream:8080"
    ports:
      - "9551:9551"
    networks:
      default:
        aliases:
          - teastore-auth
    depends_on:
      - teastore-auth

  # ── Image Provider sidecar ───────────────────────────────
  sidecar-imageprovider:
    <<: *sidecar-defaults
    environment:
      <<: *sidecar-env
      RAJOMON_SERVICE_NAME: imageprovider
      RAJOMON_LISTEN_ADDR: ":9552"
      RAJOMON_UPSTREAM_ADDR: "teastore-imageprovider-upstream:8080"
    ports:
      - "9552:9552"
    networks:
      default:
        aliases:
          - teastore-imageprovider
    depends_on:
      - teastore-imageprovider

  # ── Recommender sidecar ──────────────────────────────────
  sidecar-recommender:
    <<: *sidecar-defaults
    environment:
      <<: *sidecar-env
      RAJOMON_SERVICE_NAME: recommender
      RAJOMON_LISTEN_ADDR: ":9553"
      RAJOMON_UPSTREAM_ADDR: "teastore-recommender-upstream:8080"
    ports:
      - "9553:9553"
    networks:
      default:
        aliases:
          - teastore-recommender
    depends_on:
      - teastore-recommender

  # ── Persistence sidecar ──────────────────────────────────
  # Most contention-prone service — persistence handles all DB
  # reads/writes. Expected to show highest price under load spikes.
  sidecar-persistence:
    <<: *sidecar-defaults
    environment:
      <<: *sidecar-env
      RAJOMON_SERVICE_NAME: persistence
      RAJOMON_LISTEN_ADDR: ":9554"
      RAJOMON_UPSTREAM_ADDR: "teastore-persistence-upstream:8080"
    ports:
      - "9554:9554"
    networks:
      default:
        aliases:
          - teastore-persistence
    depends_on:
      - teastore-persistence

  # ══════════════════════════════════════════════════════════
  # Observability stack — Prometheus + Grafana
  # ══════════════════════════════════════════════════════════

  prometheus:
    image: prom/prometheus:v2.53.0
    restart: "no"
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
    depends_on:
      - sidecar-webui
      - sidecar-auth
      - sidecar-imageprovider
      - sidecar-recommender
      - sidecar-persistence

  grafana:
    image: grafana/grafana:11.1.0
    restart: "no"
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: "${GF_SECURITY_ADMIN_PASSWORD:-rajomon}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  # ══════════════════════════════════════════════════════════
  # Envoy Gateway — two variants via Compose profiles
  #
  # Usage:
  #   docker compose --profile permissive up -d   (PASS — tokens survive)
  #   docker compose --profile hardened  up -d    (FAIL — tokens stripped)
  #
  # Both listen on host :10000 → forward to sidecar-webui:9550.
  # Admin UI at http://localhost:9901
  # ══════════════════════════════════════════════════════════

  # ── Permissive gateway — passes X-Rajomon-Tokens intact ──
  envoy-permissive:
    image: envoyproxy/envoy:v1.31-latest
    restart: "no"
    profiles:
      - permissive
    ports:
      - "10000:10000"
      - "9901:9901"
    volumes:
      - ./gateway-config/envoy-permissive.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      - sidecar-webui

  # ── Hardened gateway — strips X-Rajomon-Tokens ───────────
  envoy-hardened:
    image: envoyproxy/envoy:v1.31-latest
    restart: "no"
    profiles:
      - hardened
    ports:
      - "10000:10000"
      - "9901:9901"
    volumes:
      - ./gateway-config/envoy-hardened.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    depends_on:
      - sidecar-webui
