################################################################################
# Rajomon-HTTP — Envoy Gateway (HARDENED config) — TeaStore
#
# Behaviour: strips X-Rajomon-Tokens and X-Rajomon-Price before forwarding.
# Simulates a real, restrictively-configured production gateway.
#
# Expected header-survival-check result:
#   FAIL (header stripped) — but the request still completes via fail-open,
#   proving the mechanism degrades safely rather than catastrophically.
#
# Flow: Client → Envoy :10000 → [strips headers] → sidecar-webui :9550
#       sidecar sees no token header → ForwardFailOpen → teastore-webui-upstream
################################################################################

static_resources:

  listeners:
    - name: rajomon_gateway_hardened
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: rajomon_gateway_hardened
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog

                # ── Header-sanitisation filter ─────────────────────────────────
                # Strips the Rajomon custom headers — reproduces the real risk
                # documented in Context Document §1.1 and Design Decision #6.
                # The sidecar detects missing header and fails open (safe degradation).
                http_filters:
                  - name: envoy.filters.http.header_mutation
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.header_mutation.v3.HeaderMutation
                      mutations:
                        request_mutations:
                          - remove: "x-rajomon-tokens"
                          - remove: "x-rajomon-price"
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: rajomon_routes_hardened
                  virtual_hosts:
                    - name: rajomon_backend_hardened
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: sidecar_webui
                            timeout: 15s

  clusters:
    - name: sidecar_webui
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: sidecar_webui
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      address: sidecar-webui
                      port_value: 9550

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
