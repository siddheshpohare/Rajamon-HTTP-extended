################################################################################
# Rajamon-HTTP — Phase 5: Envoy Gateway (PERMISSIVE config)
#
# Behaviour: forwards ALL request headers unchanged to sidecar-compose-post:9464.
# X-Rajomon-Tokens is NOT removed — the token travels intact through the gateway.
#
# Expected header-survival-check.sh result: PASS
################################################################################

static_resources:

  listeners:
    - name: rajomon_gateway
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 10000
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: rajomon_gateway
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                # ── NO header manipulation filters — everything passes through ──
                http_filters:
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                route_config:
                  name: rajomon_routes
                  virtual_hosts:
                    - name: rajomon_backend
                      domains: ["*"]
                      routes:
                        - match:
                            prefix: "/"
                          route:
                            cluster: sidecar_compose_post
                            timeout: 10s

  clusters:
    - name: sidecar_compose_post
      connect_timeout: 1s
      type: STRICT_DNS
      lb_policy: ROUND_ROBIN
      load_assignment:
        cluster_name: sidecar_compose_post
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address:
                      # Docker Compose service name — resolved inside the rajomon-http network
                      address: sidecar-compose-post
                      port_value: 9464

admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
